services:
  car-watchdog:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/carwatch
      DB_USERNAME: carwatch
      DB_PASSWORD: carwatch
      DB_DRIVER: org.postgresql.Driver
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - carwatch-data:/app/data
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carwatch
      POSTGRES_USER: carwatch
      POSTGRES_PASSWORD: carwatch
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  carwatch-data:
  postgres-data:
